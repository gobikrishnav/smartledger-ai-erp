# Render Blueprint for SmartLedger AI ERP
# Deploying to Render ("blender"):
# 1. In Render Dashboard (render.com), click "New +" -> "Blueprint"
# 2. Select repository: gobikrishnav/smartledger-ai-erp
# 3. Render reads this render.yaml and automatically launches the unified service!

services:
  - type: web
    name: smartledger-ai-erp
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        value: mongodb+srv://admin_user:Admin%40123@cluster0.uelwksj.mongodb.net/smartledger_erp?retryWrites=true&w=majority&appName=Cluster0
      - key: JWT_SECRET
        generateValue: true
      - key: START_CLEAN
        value: "false"
      - key: AUTO_SEED
        value: "false"
